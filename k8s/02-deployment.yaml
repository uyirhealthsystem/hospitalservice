apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-service
  namespace: uyir
  labels:
    app.kubernetes.io/name: hospital-service
    app.kubernetes.io/part-of: uyir
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: hospital-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hospital-service
        app.kubernetes.io/part-of: uyir
      # If a service mesh (Istio/Linkerd/App Mesh) is added later, its sidecar is
      # injected via a namespace/pod label here - no other change to this file needed.
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hospital-service
      containers:
        - name: hospital-service
          image: <ECR_REPO_URI>/hospital-service:<TAG>
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: hospital-service-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
