# Requires the AWS Load Balancer Controller installed on the cluster.
# group.name lets every microservice's Ingress share one ALB instead of
# provisioning one load balancer per service.
#
# WARNING: SecurityConfig currently permits all requests unauthenticated
# (see src/main/java/com/uyir/hospital/config/SecurityConfig.java). Do not
# point this Ingress at real traffic until auth is in front of it - either
# in-app (JWT/OAuth2) or centrally at an API Gateway ahead of the ALB.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hospital-service
  namespace: uyir
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: uyir-microservices
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
spec:
  rules:
    - http:
        paths:
          - path: /api/hospitals
            pathType: Prefix
            backend:
              service:
                name: hospital-service
                port:
                  number: 80
          - path: /api/hospital
            pathType: Prefix
            backend:
              service:
                name: hospital-service
                port:
                  number: 80
