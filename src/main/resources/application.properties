spring.application.name=hospital

spring.mongodb.uri=mongodb+srv://uyirpvtltd:uyirpvtltd@uyirluster.a7yqyi9.mongodb.net/hospital?appName=uyirluster
#spring.mongodb.uri=${SPRING_MONGODB_URI}
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

# K8s liveness/readiness probes - readiness includes the Mongo health indicator automatically
management.endpoint.health.probes.enabled=true
management.endpoints.web.base-path=/api/v1/hospital/actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Keep API docs under the same /api/v1/hospital prefix as every other endpoint
springdoc.api-docs.path=/api/v1/hospital/v3/api-docs
springdoc.swagger-ui.path=/api/v1/hospital/swagger-ui.html
server.port  = 8081





# Doctor seats: one FREE seat per hospital, each extra seat is a one-time purchase through payment-service.
hospital.seat.price-per-seat=10000.00
hospital.seat.currency=INR
# http = payment-service (Razorpay); mock = every purchase paid at once (local testing only, never production)
hospital.seat.payment.provider=${SEAT_PAYMENT_PROVIDER:http}
hospital.seat.payment.base-url=${PAYMENT_SERVICE_URL:http://localhost:8083}
# Must equal payment-service's payment.consumers[HOSPITAL_SEAT].webhook-secret (HOSPITAL_SEAT_PAYMENT_WEBHOOK_SECRET there)
hospital.seat.payment.webhook-secret=${PAYMENT_WEBHOOK_SECRET:}
hospital.seat.payment.webhook-tolerance=5m
hospital.seat.payment.connect-timeout=3s
hospital.seat.payment.read-timeout=10s

# Commission billing: Uyir charges each hospital per doctor appointment (never for emergency bookings),
# invoiced monthly. The default rate applies until an admin sets one (PUT /api/v1/hospital/billing/settings).
# Invoices are paid through payment-service as referenceType HOSPITAL_INVOICE, whose webhook-secret must
# also equal PAYMENT_WEBHOOK_SECRET above.
hospital.billing.default-commission-per-appointment=20.00
hospital.billing.currency=INR
# An invoice unpaid this many days after issue is OVERDUE: the hospital's new appointments pause until paid.
hospital.billing.due-days=15
# Issue last month's invoices at 00:30 IST on the 1st
hospital.billing.schedule-enabled=${BILLING_SCHEDULE_ENABLED:true}
hospital.billing.generate-cron=0 30 0 1 * *

# Follow-up reminders: emails (via hospital.events -> notification-service) for follow-ups the patient
# hasn't booked, 1-2 days before and on the due date. Hourly 09:00-20:00 IST; each is sent once.
hospital.follow-up.reminders-enabled=${FOLLOW_UP_REMINDERS_ENABLED:true}
hospital.follow-up.reminder-cron=0 0 9-20 * * *

# Payout account: the hospital's bank account (Razorpay Route linked account), onboarded through payment-service.
# http = payment-service; mock = every payout account ACTIVATED at once (local testing only, never production)
hospital.payout.provider=${PAYOUT_PROVIDER:http}
hospital.payout.base-url=${PAYMENT_SERVICE_URL:http://localhost:8083}
# Razorpay business category every hospital is registered under
hospital.payout.category=healthcare
hospital.payout.subcategory=hospitals
hospital.payout.connect-timeout=3s
# onboarding is up to four Razorpay calls in a row
hospital.payout.read-timeout=60s

# Emergency booking alerts. A new booking is published as EmergencyBookingRequested to Kafka topic
# hospital.events: notification-service emails the hospital, and every hospitalservice pod consumes it too
# and pushes it to that hospital's open dashboards (GET /api/v1/hospital/emergency-bookings/stream, SSE).
# kafka = the above; local = this pod's dashboards only, no Kafka and no email (single-instance local dev only).
# Kafka is also skipped (one startup warning, same as local) when KAFKA_BROKERS is unset, so a plain local run
# needs no broker. docker-compose and k8s set KAFKA_BROKERS.
hospital.events.provider=${HOSPITAL_EVENTS_PROVIDER:kafka}
hospital.events.topic=hospital.events
# An open dashboard stream is closed after this long; the client reconnects (and refetches the booking list)
hospital.events.sse-timeout=30m
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:}
spring.kafka.client-id=hospitalservice
# Fail a publish fast when Kafka is unreachable instead of waiting the 60s default for broker metadata
spring.kafka.producer.properties.max.block.ms=5000
